name: Produzir artes

# ============================================================================
# DESATIVADO EM 12/11/2026 — o sistema não gera mais arte.
#
# O Woodstock virou um painel de coleta: a banda manda os dados e as fotos, e as
# artes são feitas fora do sistema. Nada aqui foi apagado; o que mudou é que o
# agendamento saiu, então este fluxo não roda mais sozinho.
#
# Ele continua podendo ser disparado à mão (workflow_dispatch), de propósito: é
# assim que dá para conferir o motor sem religá-lo para todo mundo.
#
# PARA RELIGAR: devolver o bloco "schedule" abaixo, pôr MOTOR_DE_ARTES_LIGADO = true
# em apps-script/00_Config.gs e rodar instalar() para recriar os gatilhos.
#
#   schedule:
#     - cron: '3,13,23,33,43,53 * * * *'
#
# O texto abaixo descreve como era quando estava ligado, e vale para quando voltar.
# ============================================================================
#
# Três caminhos levavam a produção a acontecer, e a redundância era de propósito:
#
#  1. este agendamento, de 10 em 10 minutos, que é a GARANTIA — se todo o resto
#     falhar, a banda recebe a arte no próximo giro;
#  2. o empurrão do Apps Script, que é a PRESSA — ele chama este fluxo assim que uma
#     banda se inscreve, para a arte não esperar o próximo giro. Quando esse empurrão
#     falha, não é grave: o giro de 10 minutos pega;
#  3. a rotina de destravamento no Apps Script, que devolve à fila a programação
#     parada há mais de 45 minutos, e avisa por e-mail do segundo tranco em diante.
#
# Os três cobrem falhas DIFERENTES, e por isso nenhum deles sai. O caso que só o
# empurrão cobre: o GitHub desliga agendamento em repositório sem atividade por 60
# dias, então um período sem shows mataria o item 1 em silêncio.
#
# Nada depende de computador ligado.
on:
  # O Apps Script empurra por aqui: workflow_dispatch, abaixo.
  #
  # O repository_dispatch com o nome "produzir-artes" fica declarado e NINGUÉM o
  # dispara hoje — está escrito aqui para quem ler saber disso, e não para ser
  # removido. Um gatilho a mais não custa nada, e tirar um caminho de entrada de um
  # sistema que funciona é a troca errada: o risco é todo de um lado.
  repository_dispatch:
    types: [produzir-artes]
  workflow_dispatch:

concurrency:
  group: artes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produzir:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pergunta primeiro se há banda esperando arte. Sem isso, cada ciclo instalaria
      # o navegador e os modelos de recorte à toa — o que permite conferir a fila de
      # 5 em 5 minutos em vez de 15, continuando de graça.
      - name: Tem trabalho na fila?
        id: fila
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
        run: |
          resposta=$(curl -sL --max-time 60 \
            "$APPS_SCRIPT_URL?acao=estado&chave=$APPS_SCRIPT_TOKEN" || echo '{}')
          esperando=$(printf '%s' "$resposta" | grep -o '"AGUARDANDO_ARTES":[0-9]*' | grep -o '[0-9]*$' || true)
          echo "esperando=${esperando:-0}"
          if [ "${esperando:-0}" -gt 0 ]; then
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          else
            echo "tem=nao" >> "$GITHUB_OUTPUT"
            echo "Nenhuma banda esperando arte; encerrando sem instalar nada."
          fi

      - uses: actions/checkout@v4
        if: steps.fila.outputs.tem == 'sim'

      - uses: actions/setup-node@v4
        if: steps.fila.outputs.tem == 'sim'
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        if: steps.fila.outputs.tem == 'sim'
        with:
          python-version: '3.11'

      # Os modelos de recorte somam centenas de MB. Guardar em cache evita baixar
      # tudo de novo a cada execução. O rembg guarda em uma pasta ou na outra,
      # dependendo da versão, então as duas entram.
      #
      # A chave muda sempre que a lista de modelos muda. Ela foi para v2 ao entrar
      # o modelo de matting, que são mais 110 MB: o cache do GitHub só grava quando
      # a chave é nova, então manter a chave antiga faria o modelo novo ser baixado
      # de novo em toda execução, para sempre.
      # As duas pastas precisam EXISTIR antes do cache entrar, mesmo vazias. Quando
      # uma delas não existe, o passo de gravação termina com "Path Validation
      # Error" e não salva nada — sem falhar a execução, o que torna o problema
      # invisível. Foi o que aconteceu: o cache nunca era gravado, toda execução
      # baixava 1,3 GB de modelos de novo, e várias morriam no meio do download.
      - name: Garantir as pastas dos modelos
        if: steps.fila.outputs.tem == 'sim'
        run: mkdir -p ~/.u2net ~/.rembg

      - name: Cache dos modelos de recorte
        if: steps.fila.outputs.tem == 'sim'
        uses: actions/cache@v4
        with:
          path: |
            ~/.u2net
            ~/.rembg
          key: rembg-birefnet-u2net-isnet-vitmatte-v2
          # Sem achar a chave exata, aproveita o cache anterior que começa igual.
          # Assim, acrescentar um modelo novo passa a custar só o modelo novo, e
          # não o pacote inteiro outra vez.
          restore-keys: |
            rembg-birefnet-u2net-isnet-

      - name: Cache do navegador do gerador
        if: steps.fila.outputs.tem == 'sim'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('gerador/package.json') }}

      - name: Instalar dependências
        if: steps.fila.outputs.tem == 'sim'
        run: |
          python -m pip install --quiet --upgrade pip
          # As versões estão escritas em worker/requirements.txt, e o porquê de cada
          # uma está lá. Em resumo: sem versão escrita, uma atualização de biblioteca
          # quebrava a produção na hora em que uma banda estava esperando a arte.
          python -m pip install --quiet -r worker/requirements.txt
          npm --prefix gerador install --no-audit --no-fund
          npm --prefix gerador exec -- playwright install --with-deps chromium

      # Quanto de memória a máquina tem, escrito antes de começar. Quando o sistema
      # operacional mata o processo por falta de memória, não sobra erro nenhum: a
      # execução simplesmente para no meio. Ter este número no registro é o que
      # permite dizer depois se foi isso ou outra coisa.
      - name: Memória disponível antes de começar
        if: steps.fila.outputs.tem == 'sim'
        run: free -m; nproc

      - name: Produzir as artes pendentes
        if: steps.fila.outputs.tem == 'sim'
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          PYTHON_BIN: python
        run: node worker/produzir.mjs
