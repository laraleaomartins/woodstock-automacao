name: Produzir artes

# Roda sozinho a cada 15 minutos, nos servidores do GitHub. Não depende de nenhum
# computador ligado. O Apps Script também pode chamar na hora, pelo evento
# "produzir-artes", quando uma banda acaba de se inscrever.
on:
  schedule:
    # Horários deslocados de propósito: o GitHub atrasa ou engole execuções
    # agendadas em minutos redondos, quando a fila dele está cheia.
    - cron: '3,13,23,33,43,53 * * * *'
  repository_dispatch:
    types: [produzir-artes]
  workflow_dispatch:

concurrency:
  group: artes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produzir:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pergunta primeiro se há banda esperando arte. Sem isso, cada ciclo instalaria
      # o navegador e os modelos de recorte à toa — o que permite conferir a fila de
      # 5 em 5 minutos em vez de 15, continuando de graça.
      - name: Tem trabalho na fila?
        id: fila
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
        run: |
          resposta=$(curl -sL --max-time 60 \
            "$APPS_SCRIPT_URL?acao=estado&chave=$APPS_SCRIPT_TOKEN" || echo '{}')
          esperando=$(printf '%s' "$resposta" | grep -o '"AGUARDANDO_ARTES":[0-9]*' | grep -o '[0-9]*$' || true)
          echo "esperando=${esperando:-0}"
          if [ "${esperando:-0}" -gt 0 ]; then
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          else
            echo "tem=nao" >> "$GITHUB_OUTPUT"
            echo "Nenhuma banda esperando arte; encerrando sem instalar nada."
          fi

      - uses: actions/checkout@v4
        if: steps.fila.outputs.tem == 'sim'

      - uses: actions/setup-node@v4
        if: steps.fila.outputs.tem == 'sim'
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        if: steps.fila.outputs.tem == 'sim'
        with:
          python-version: '3.11'

      # Os modelos de recorte somam centenas de MB. Guardar em cache evita baixar
      # tudo de novo a cada execução. O rembg guarda em uma pasta ou na outra,
      # dependendo da versão, então as duas entram.
      #
      # A chave muda sempre que a lista de modelos muda. Ela foi para v2 ao entrar
      # o modelo de matting, que são mais 110 MB: o cache do GitHub só grava quando
      # a chave é nova, então manter a chave antiga faria o modelo novo ser baixado
      # de novo em toda execução, para sempre.
      # As duas pastas precisam EXISTIR antes do cache entrar, mesmo vazias. Quando
      # uma delas não existe, o passo de gravação termina com "Path Validation
      # Error" e não salva nada — sem falhar a execução, o que torna o problema
      # invisível. Foi o que aconteceu: o cache nunca era gravado, toda execução
      # baixava 1,3 GB de modelos de novo, e várias morriam no meio do download.
      - name: Garantir as pastas dos modelos
        if: steps.fila.outputs.tem == 'sim'
        run: mkdir -p ~/.u2net ~/.rembg

      - name: Cache dos modelos de recorte
        if: steps.fila.outputs.tem == 'sim'
        uses: actions/cache@v4
        with:
          path: |
            ~/.u2net
            ~/.rembg
          key: rembg-birefnet-u2net-isnet-vitmatte-v2
          # Sem achar a chave exata, aproveita o cache anterior que começa igual.
          # Assim, acrescentar um modelo novo passa a custar só o modelo novo, e
          # não o pacote inteiro outra vez.
          restore-keys: |
            rembg-birefnet-u2net-isnet-

      - name: Cache do navegador do gerador
        if: steps.fila.outputs.tem == 'sim'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('gerador/package.json') }}

      - name: Instalar dependências
        if: steps.fila.outputs.tem == 'sim'
        run: |
          python -m pip install --quiet --upgrade pip
          # scipy entra escrito, e não de carona: a preparação das imagens usa o
          # scipy.ndimage para esfumar borda e para medir buraco no meio de uma
          # logo. Ele vinha junto como dependência do rembg, o que é uma corda que
          # alguém pode cortar numa versão nova sem avisar.
          python -m pip install --quiet "rembg[cpu]" pillow numpy scipy
          npm --prefix gerador install --no-audit --no-fund
          npm --prefix gerador exec -- playwright install --with-deps chromium

      - name: Produzir as artes pendentes
        if: steps.fila.outputs.tem == 'sim'
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          PYTHON_BIN: python
        run: node worker/produzir.mjs
