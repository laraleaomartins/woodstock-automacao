<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{--preto:#0a0a0a;--vermelho:#d6121c;--cinza:#1b1b1b;--borda:#2e2e2e;--texto:#f2f2f2;--fraco:#9a9a9a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--preto);color:var(--texto);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px;padding-bottom:60px}
  h1{font-size:20px;letter-spacing:1px}
  h1 span{color:var(--vermelho)}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
  .aviso{background:#3a2a00;border:1px solid #7a5c00;color:#ffd96b;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  nav button{background:var(--cinza);color:var(--fraco);border:1px solid var(--borda);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:14px}
  nav button.on{background:var(--vermelho);color:#fff;border-color:var(--vermelho)}
  .cartao{background:var(--cinza);border:1px solid var(--borda);border-radius:10px;padding:14px;margin-bottom:12px}
  .linha{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .banda{font-size:17px;font-weight:700}
  .meta{color:var(--fraco);font-size:13px}
  .etq{display:inline-block;font-size:11px;letter-spacing:.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--borda);background:#000}
  .e-AGUARDANDO_APROVACAO{background:#4a3a00;color:#ffd96b;border-color:#7a5c00}
  .e-AGENDADA,.e-PUBLICADO,.e-APROVADA{background:#0d3a1a;color:#6ee89a;border-color:#1a6b33}
  .e-ERRO_ARTES,.e-FALHA,.e-REPROVADA{background:#430f12;color:#ff8d95;border-color:#7a1a20}
  .e-CANCELADA,.e-CANCELADO,.e-PAUSADA,.e-PAUSADO{background:#2a2a2a;color:#bbb}
  .e-AGUARDANDO_ARTES,.e-GERANDO_ARTES,.e-AGENDADO{background:#0f2a43;color:#8fc6ff;border-color:#1b4e7a}
  .artes{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
  .artes figure{flex:0 0 auto;width:104px}
  .artes img{width:104px;border-radius:6px;border:1px solid var(--borda);display:block;background:#000}
  .artes figcaption{font-size:11px;color:var(--fraco);text-align:center;margin-top:4px}
  .acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  /* Cada filtro é uma caixa fechada, com o nome em cima e o seu próprio botão de
     limpar: assim nenhum parece continuação do outro, e dá para usar um sozinho. */
  .filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
  .grupoFiltro{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    border:1px solid var(--borda);border-radius:9px;padding:8px 10px}
  .rotuloFiltro{display:block;width:100%;color:var(--fraco);font-size:11px;
    text-transform:uppercase;letter-spacing:.6px}
  .ate{color:var(--fraco);font-size:12px}
  button.b.mini{padding:4px 9px;line-height:1}
  /* As fotos que a banda enviou. Ficam acima das artes de propósito: quando uma
     arte sai ruim, é aqui que se descobre qual foto consertar. */
  .fotos{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .foto{width:150px;border:1px solid var(--borda);border-radius:9px;overflow:hidden;
    background:#000;display:flex;flex-direction:column}
  .foto img{width:100%;height:116px;object-fit:cover;display:block;background:#111}
  .foto .corpo{padding:7px 8px;display:flex;flex-direction:column;gap:5px}
  .foto .nome{font-size:11px;color:var(--fraco);word-break:break-all}
  .foto .estado{font-size:10px;letter-spacing:.5px;text-transform:uppercase;
    border-radius:4px;padding:2px 6px;align-self:flex-start}
  /* ---------- a faixa de próximo passo ----------
     Diz em que pé o show está e o que fazer agora. A cor é o tom, não enfeite:
     azul é espera, amarelo pede você, vermelho é problema, verde é resolvido. */
  .passo{margin-top:10px;padding:9px 12px;border-radius:8px;font-size:13.5px;
    border:1px solid transparent;line-height:1.45}
  .passo.t-espera{background:#0f2030;border-color:#1b4e7a;color:#a8cdf0}
  .passo.t-voce{background:#332500;border-color:#7a5c00;color:#ffd96b}
  .passo.t-erro{background:#2e0c0f;border-color:#7a1a20;color:#ffa8ae}
  .passo.t-ok{background:#0d2416;border-color:#1a6b33;color:#8fe0ab}
  .passo.t-fim{background:#1e1e1e;border-color:var(--borda);color:var(--fraco)}

  /* ---------- erro e avisos ----------
     Os avisos vinham emendados num parágrafo só, separados por barra: seis frases
     longas grudadas, que ninguém lê. Agora cada um é um item. */
  .erroCaixa{margin-top:10px;padding:9px 12px;border-radius:8px;font-size:13px;
    background:#2e0c0f;border:1px solid #7a1a20;color:#ffa8ae}
  .avisos{margin-top:10px;padding:9px 12px 10px;border-radius:8px;font-size:13px;
    background:#241a00;border:1px solid #6b5200;color:#f0d388}
  .avisos .tituloAviso{font-weight:700;margin-bottom:5px}
  .avisos ul{margin:0;padding-left:18px}
  .avisos li{margin:3px 0;line-height:1.45}

  /* ---------- seções dentro do cartão ----------
     Fotos e artes passam a ser blocos com título, em vez de duas galerias soltas
     uma embaixo da outra sem separação. */
  .secao{margin-top:14px;border:1px solid var(--borda);border-radius:10px;
    background:#141414;overflow:hidden}
  .tituloSecao{display:flex;align-items:center;gap:8px;padding:9px 12px;
    font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--fraco);
    border-bottom:1px solid var(--borda)}
  .tituloSecao .conta{margin-left:auto;text-transform:none;letter-spacing:0;
    font-size:12px}
  .secao .artes,.secao .fotos{margin:0;padding:12px}
  .rodapeSecao{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    padding:10px 12px;border-top:1px solid var(--borda);background:#111}
  .rodapeSecao .explica{flex:1 1 320px;margin:0;font-size:12.5px;color:var(--fraco);
    line-height:1.45}

  /* ---------- as ações, em três pesos ----------
     Antes era uma fileira única de até dez botões iguais, com aprovar do lado de
     cancelar tudo. A ação que conclui o trabalho e a que o desfaz tinham o mesmo
     peso visual. */
  .acoesCartao{margin-top:14px;border-top:1px solid var(--borda);padding-top:12px;
    display:flex;flex-direction:column;gap:9px}
  .acoes.principal .b{font-size:15px;padding:10px 18px}
  .acoes.apoio{align-items:center}
  .acoes.apoio .b{background:#1e1e1e;color:var(--texto)}
  .acoes.perigo{margin-top:2px}
  /* Link que é botão tem de parecer botão: sem sublinhado e com a mesma caixa. */
  .acoes a.b{text-decoration:none;display:inline-flex;align-items:center}
  /* As artes têm formatos diferentes (feed é mais quadrado, story é mais alto), e
     alinhadas pelo topo a fileira ficava serrilhada. Altura igual para todas, e a
     largura acompanha: cada uma continua com a sua proporção. */
  .artes figure{width:auto}
  .artes img{width:auto;height:150px;max-width:140px;object-fit:contain}
  .artes .escolher{display:flex;align-items:center;gap:5px;font-size:11px;
    color:var(--fraco);margin-bottom:4px}
  .b.risco{background:transparent;border-color:#7a1a20;color:#ff8d95}
  .b.risco:hover{background:#2e0c0f}
  .b:disabled{opacity:.45;cursor:not-allowed}
  .escolhaModo{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
    color:var(--fraco)}
  .escolhaModo select{background:var(--cinza);color:var(--texto);
    border:1px solid var(--borda);border-radius:7px;padding:6px 8px;font-size:13px}

  /* ---------- telas pequenas ----------
     No celular a fileira de botões virava uma coluna de botões estreitos, cada um
     do tamanho do seu texto. Aqui a ação principal ocupa a largura toda, que é o
     alvo mais fácil de acertar com o polegar. */
  @media (max-width: 640px){
    body{padding:12px;padding-bottom:70px}
    .cartao{padding:12px}
    .linha{align-items:flex-start}
    .passo{font-size:13px}
    .acoes.principal{flex-direction:column;align-items:stretch}
    .acoes.principal .b{width:100%;text-align:center}
    .rodapeSecao .b{width:100%}
    .foto{width:100%}
    .foto img{height:180px}
    .ficha{grid-template-columns:1fr}
    .ficha .rot{flex-basis:110px}
    .filtros{flex-direction:column;align-items:stretch}
    .grupoFiltro{width:100%}
  }
  @media (min-width: 641px) and (max-width: 1024px){
    .foto{width:calc(50% - 5px)}
    .foto img{height:150px}
  }
  /* ---------- a ficha da banda ----------
     Cada dado é um bloco, e o bloco inteiro é o botão de copiar. Antes era uma
     tabela com um botão "copiar" por linha: nove botões cinzentos empilhados, com
     o mesmo peso visual do dado que importa — parecia a planilha que o painel
     deveria poupar de olhar. */
  .fichaBanda{background:#131313}
  .grupoDados{padding:10px 14px 2px;border-top:1px solid rgba(255,255,255,.055)}
  .grupoDados:first-of-type{border-top:0}
  .rotuloGrupo{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;
    color:#6f6f6f;margin-bottom:7px}
  .blocos{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:8px;padding-bottom:10px}

  .dado{position:relative;display:flex;flex-direction:column;gap:3px;
    text-align:left;width:100%;padding:9px 11px;border-radius:9px;
    border:1px solid var(--borda);background:#191919;color:var(--texto);
    font:inherit;cursor:default}
  button.dado{cursor:pointer;transition:border-color .12s,background .12s}
  button.dado:hover{background:#202020;border-color:#454545}
  button.dado:active{background:#262626}
  button.dado:focus-visible{outline:2px solid var(--vermelho);outline-offset:2px}

  .dado .rot{font-size:10px;letter-spacing:.9px;text-transform:uppercase;
    color:#7d7d7d;line-height:1}
  .dado .val{font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
  .dado.semValor .val{color:#6f6f6f;font-style:italic;font-size:13px}

  /* A pista de "copiar" só aparece quando o ponteiro chega perto. Fixa, ela seria
     a mesma fileira de botões de antes, só que menor. */
  .dado .pista{position:absolute;right:9px;top:8px;font-size:9.5px;
    letter-spacing:.8px;text-transform:uppercase;color:#6f6f6f;opacity:0;
    transition:opacity .12s}
  button.dado:hover .pista,button.dado:focus-visible .pista{opacity:1}
  button.dado.copiado{border-color:#1a6b33;background:#102a19}
  button.dado.copiado .pista{opacity:1;color:#7ee29a}

  /* ---------- as fotos ----------
     Uma ação por foto: baixar. Eram quatro, e três serviam ao gerador de arte. */
  .fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
    gap:12px;padding:12px}
  .foto{width:auto;margin:0;border:1px solid var(--borda);border-radius:10px;
    overflow:hidden;background:#0f0f0f;display:flex;flex-direction:column}
  .foto img{width:100%;height:150px;object-fit:cover;display:block;background:#161616}
  .foto figcaption{display:flex;align-items:center;gap:8px;padding:8px 9px}
  .foto .nome{flex:1;min-width:0;font-size:11px;color:var(--fraco);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .foto figcaption .b{flex:0 0 auto}

  @media (max-width: 640px){
    .blocos{grid-template-columns:1fr 1fr}
    .fotos{grid-template-columns:1fr 1fr;gap:8px;padding:8px}
    .foto img{height:120px}
    .foto figcaption{flex-direction:column;align-items:stretch;gap:6px}
    .foto figcaption .b{width:100%}
  }
  /* O cartão de dados deixou de ser uma gaveta fechada: num painel de coleta, os
     dados SÃO o conteúdo, e esconder o conteúdo atrás de um clique é trabalho a
     mais em cada banda. */
  .secao .ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:0 24px;padding:4px 12px 12px}
  .ficha .campo.semValor .val{color:var(--fraco);font-style:italic}
  .ficha .copia{margin-left:auto}
  .tituloSecao .b.mini{margin-left:auto;text-transform:none;letter-spacing:0}
  .e-inscrita{background:#15223a;color:#9cc3f0;border-color:#2a4a73}
  table tr.passou td{color:var(--fraco)}
  .fichaBox{margin-top:12px;border:1px solid var(--borda);border-radius:10px;
    background:#121212}
  .fichaBox summary{cursor:pointer;padding:9px 12px;font-size:13px;color:var(--fraco);
    user-select:none}
  .fichaBox[open] summary{border-bottom:1px solid var(--borda);color:var(--texto)}
  .ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2px;
    padding:10px 12px 0}
  .ficha .campo{display:flex;align-items:center;gap:8px;padding:5px 0;
    border-bottom:1px solid rgba(255,255,255,.05)}
  .ficha .rot{flex:0 0 125px;font-size:11px;letter-spacing:.4px;color:var(--fraco);
    text-transform:uppercase}
  .ficha .val{flex:1;font-size:13px;word-break:break-word}
  .ficha .campo .b.mini{opacity:.35;transition:opacity .12s}
  .ficha .campo:hover .b.mini,.ficha .campo .b.mini:focus{opacity:1}
  .fotos img{background:#161616}
  .semPrevia{display:flex;align-items:center;justify-content:center;text-align:center;
    padding:10px;font-size:11px;color:var(--fraco);background:#161616;min-height:120px}
  .e-ok{background:#0e2a16;color:#7ee29a;border:1px solid #1d5c33}
  .e-erro{background:#2e0d10;color:#ff9aa2;border:1px solid #7a2129}
  .e-duvidoso{background:#3a2a00;color:#ffd96b;border:1px solid #7a5c00}
  .e-editada{background:#102236;color:#8fc4ff;border:1px solid #28527f}
  .e-sem_informacao{background:#1a1a1a;color:var(--fraco);border:1px solid var(--borda)}
  .foto .motivo{font-size:11px;color:#cfcfcf;line-height:1.35}
  .foto .acoesFoto{display:flex;flex-wrap:wrap;gap:4px}
  .foto .acoesFoto button{font-size:10px;padding:3px 7px}
  .usando{font-size:10px;color:var(--fraco)}
  .artes .refaz{display:block;width:100%;margin-top:4px;font-size:11px;padding:3px 0}
  .filtros input[type=search]{width:230px;background:#000;color:var(--texto);
    border:1px solid var(--borda);border-radius:7px;padding:8px 12px;font-size:13px}
  .filtros input[type=date]{background:#000;color:var(--texto);border:1px solid var(--borda);
    border-radius:7px;padding:7px 9px;font-size:13px;margin-left:5px}
  .filtros .fdata{color:var(--fraco);font-size:13px}
  .filtros .sep{width:1px;height:22px;background:var(--borda);margin:0 4px}
  /* A marca de escolher a peça fica POR CIMA da arte, no canto: fora dela, numa
     lista separada, obrigaria a olhar a arte e procurar a linha dela embaixo. */
  figure{position:relative}
  .escolher{position:absolute;top:6px;left:6px;z-index:2;display:flex;align-items:center;
    gap:5px;background:rgba(0,0,0,.72);border:1px solid var(--borda);border-radius:6px;
    padding:3px 7px;font-size:11px;color:var(--texto);cursor:pointer}
  .escolher input{margin:0;cursor:pointer}
  button.b{border:1px solid var(--borda);background:#000;color:var(--texto);padding:8px 12px;border-radius:7px;cursor:pointer;font-size:13px}
  button.b:hover{border-color:var(--vermelho)}
  button.b.forte{background:var(--vermelho);border-color:var(--vermelho);color:#fff;font-weight:600}
  button.b:disabled{opacity:.4;cursor:not-allowed}
  /* O botão só valia para <button>, e o link do Drive — que também usa a classe —
     ficava sem estilo nenhum: texto de link escuro sobre fundo escuro, quase
     invisível. Link que é botão precisa parecer botão. */
  a.b{display:inline-flex;align-items:center;border:1px solid var(--borda);
    background:#000;color:var(--texto);padding:8px 12px;border-radius:7px;
    font-size:13px;text-decoration:none}
  a.b:hover{border-color:var(--vermelho)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--borda);vertical-align:top}
  th{color:var(--fraco);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  input,select,textarea{background:#000;color:var(--texto);border:1px solid var(--borda);border-radius:6px;padding:7px 9px;font:inherit;font-size:13px}
  textarea{width:100%;min-height:150px;font-family:ui-monospace,monospace;font-size:12px}
  .cfg{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--borda)}
  .cfg .ajuda{color:var(--fraco);font-size:12.5px;margin-top:3px}
  .cfg code{color:#8fc6ff;font-size:12px}
  .vazio{color:var(--fraco);padding:30px;text-align:center}
  #recado{position:fixed;left:16px;right:16px;bottom:16px;background:var(--vermelho);color:#fff;padding:12px 14px;border-radius:8px;display:none;z-index:9;font-size:14px}
  dialog{background:var(--cinza);color:var(--texto);border:1px solid var(--borda);border-radius:10px;max-width:640px;width:92%;padding:18px}
  dialog::backdrop{background:rgba(0,0,0,.7)}
  @media(max-width:520px){.cfg{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>WOOD<span>STOCK</span> · painel</h1>
  <div class="meta" id="estado">carregando…</div>
</header>

<div class="aviso" id="trava" style="display:none"></div>

<!-- O painel é de COLETA: a banda manda os dados e as fotos, e as artes são
     feitas fora. Saíram as abas de Configurações (ajustes de publicação, que não
     existe mais) e o Calendário virou Agenda, listando os shows por data em vez da
     fila de publicações. -->
<nav>
  <button class="on" data-aba="programacoes">Inscrições</button>
  <button data-aba="calendario">Agenda dos shows</button>
  <button data-aba="historico">Histórico</button>
</nav>

<div id="barraFiltro" class="filtros">
  <div class="grupoFiltro">
    <span class="rotuloFiltro">Banda ou artista</span>
    <input type="search" id="fBanda" placeholder="parte do nome ou do @" oninput="desenharProgramacoes()">
    <button class="b mini" onclick="limparUm(['fBanda'])" title="limpar este filtro">×</button>
  </div>
  <div class="grupoFiltro">
    <span class="rotuloFiltro">Data da inscrição</span>
    <input type="date" id="fInscDe" onchange="desenharProgramacoes()">
    <span class="ate">até</span>
    <input type="date" id="fInscAte" onchange="desenharProgramacoes()">
    <button class="b mini" onclick="limparUm(['fInscDe','fInscAte'])" title="limpar este filtro">×</button>
  </div>
  <div class="grupoFiltro">
    <span class="rotuloFiltro">Data do show</span>
    <input type="date" id="fShowDe" onchange="desenharProgramacoes()">
    <span class="ate">até</span>
    <input type="date" id="fShowAte" onchange="desenharProgramacoes()">
    <button class="b mini" onclick="limparUm(['fShowDe','fShowAte'])" title="limpar este filtro">×</button>
  </div>
  <div class="grupoFiltro">
    <span class="rotuloFiltro">Relatório em PDF</span>
    <button class="b" onclick="baixarRelatorio('SEMANAL')">Semanal</button>
    <button class="b" onclick="baixarRelatorio('MENSAL')">Mensal</button>
    <button class="b" onclick="baixarRelatorio('TRIMESTRAL')">Trimestral</button>
  </div>
  <div class="grupoFiltro">
    <button class="b" onclick="limparFiltros()">Limpar tudo</button>
    <span class="meta" id="contagem"></span>
  </div>
</div>
<div id="programacoes"></div>
<div id="calendario" hidden></div>
<div id="historico" hidden></div>

<div id="recado"></div>

<dialog id="janela"><div id="janelaCorpo"></div>
  <div class="acoes"><button class="b" onclick="document.getElementById('janela').close()">Fechar</button></div>
</dialog>

<script>
// O valor entra aqui por substituição de texto, não pelo mecanismo de template:
// ele escapa o conteúdo e a chave chegaria deturpada.
var CHAVE = '__CHAVE__';
var dados = null;

function recado(texto, ms){
  var el = document.getElementById('recado');
  el.textContent = texto; el.style.display = 'block';
  clearTimeout(el._t); el._t = setTimeout(function(){ el.style.display='none'; }, ms || 4000);
}
function aspas(texto){ return '&#39;' + String(texto).replace(/'/g, '') + '&#39;'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// ------------------------------------------------- em que pé está cada show

// A situação em palavras, e não no nome interno. "AGUARDANDO_APROVACAO" é como o
// sistema guarda; quem opera lê "esperando você aprovar".

/**
 * A faixa de próximo passo: onde este show está e o que fazer agora.
 *
 * Existe porque o painel mostrava a situação como uma etiqueta e mais nada. Quem
 * nunca usou o sistema olhava "GERANDO_ARTES" e não sabia se devia esperar, clicar
 * em algo ou se tinha travado — e, numa vez em que travou de verdade, foi
 * exatamente essa a dúvida.
 *
 * Devolve o texto e o tom. A ação principal fica ao lado, montada por quem chama.
 */

/**
 * Os avisos da produção, um por linha e sem o nome técnico da peça.
 *
 * Eles vinham grudados num parágrafo só, separados por barra: seis frases longas
 * emendadas, misturando problema de foto com problema de arte. Ninguém lê isso. E
 * "peça A" não quer dizer nada para quem não decorou os layouts.
 */

// ------------------------------------------------- uma operação de cada vez

// O que está em andamento agora, por banda e por tipo de operação.
//
// O defeito que isto guarda, medido no registro: um show recebeu OITO pedidos de
// refazer em poucos minutos. Cada clique enfileirava uma produção nova, e a de
// antes nem tinha terminado. Nada no painel dizia que já havia um pedido correndo,
// e o botão continuava ali, convidativo, depois do clique.
//
// A trava é por banda e por operação: refazer as artes da banda A não impede
// aprovar a banda B, e não impede nem mesmo cancelar a própria banda A.
var emAndamento = {};

function ocupado(chaveTrava){
  return !!(chaveTrava && emAndamento[chaveTrava]);
}

/**
 * Chama o sistema, com trava e com o botão desligado enquanto dura.
 *
 * `trava` é opcional. Quando vem, um segundo clique na mesma operação da mesma
 * banda é recusado com um recado em vez de virar um segundo pedido — e o botão
 * fica desligado, para o clique nem acontecer.
 */
function chamar(fn, args, aoTerminar, trava, botao){
  if (ocupado(trava)){
    recado('Isso já está sendo feito. Espere terminar.', 5000);
    return;
  }
  if (trava) emAndamento[trava] = true;

  var rotuloAntes = null;
  if (botao){
    rotuloAntes = botao.textContent;
    botao.disabled = true;
    botao.textContent = 'fazendo…';
  }
  var soltar = function(){
    if (trava) delete emAndamento[trava];
    if (botao){
      botao.disabled = false;
      if (rotuloAntes !== null) botao.textContent = rotuloAntes;
    }
  };

  recado('Processando…', 60000);
  google.script.run
    .withSuccessHandler(function(r){
      soltar();
      recado('Pronto.');
      if (aoTerminar) aoTerminar(r); else carregar();
    })
    .withFailureHandler(function(e){
      soltar();
      recado('Não deu certo: ' + e.message, 9000);
    })
    [fn].apply(null, [CHAVE].concat(args || []));
}

// ------------------------------------------------- refazer as artes

/**
 * Refazer as artes de uma banda. UMA ação, para todas as peças.
 *
 * Antes havia um botão "refazer" em cada uma das seis artes, mais um "Refazer
 * todas" embaixo: sete botões para uma operação só. E os seis individuais mentiam —
 * clicar no de uma peça refazia as seis do mesmo jeito, porque as seis saem do
 * mesmo tratamento das fotos e não existe refazer uma sem refazer o tratamento. A
 * tela contradizia o próprio aviso que ela mostrava.
 *
 * Agora é um botão só, embaixo da galeria, com a frase que explica por quê.
 */

function acharPrograma(id){
  return ((dados && dados.programacoes) || []).filter(function(x){
    return x.id === id;
  })[0];
}


function carregar(){
  google.script.run.withSuccessHandler(function(d){ dados = d; desenhar(); })
    .withFailureHandler(function(e){ recado('Erro ao carregar: ' + e.message, 9000); })
    .painelCarregar(CHAVE);
}

function desenhar(){
  var e = dados.estado;
  // O resumo falava de publicação — fila, publicadas, modo —, que não existe mais.
  // Agora conta o que este painel coleta: inscrições e fotos.
  var ativas = dados.programacoes.filter(function(p){ return p.situacao !== 'CANCELADA'; });
  var fotos = ativas.reduce(function(n, p){ return n + ((p.fotos || []).length); }, 0);
  document.getElementById('estado').textContent =
    ativas.length + (ativas.length === 1 ? ' inscrição' : ' inscrições') + ' · ' +
    fotos + (fotos === 1 ? ' foto recebida' : ' fotos recebidas');

  var trava = document.getElementById('trava');
  if (!e.publicandoDeVerdade){
    trava.style.display = 'block';
    trava.innerHTML = '<b>Modo de teste ligado.</b> O sistema faz tudo — cria as artes, escreve as ' +
      'legendas e cumpre o calendário — mas <b>não envia nada para o Instagram</b>; as publicações ' +
      'ficam marcadas como SIMULADO. Para publicar de verdade, mude <code>PUBLICAR_DE_VERDADE</code> ' +
      'para SIM em Configurações.';
  } else if (!e.instagramConectado){
    trava.style.display = 'block';
    trava.innerHTML = '<b>Instagram não conectado.</b> As publicações vão falhar até as credenciais serem configuradas.';
  } else { trava.style.display = 'none'; }

  desenharProgramacoes(); desenharAgenda(); desenharHistorico();
}

// As programações chegam do servidor já em ordem de data, da mais recente para a
// mais antiga. A lista só é filtrada aqui — a ordem não é mexida.
// Dois recortes de data, que respondem perguntas diferentes e podem ser usados
// juntos: "o que entrou esta semana" (data da inscrição) e "quem toca em dezembro"
// (data do show). Um só não serve para as duas coisas.
function programacoesFiltradas(){
  var v = function(id){ return document.getElementById(id).value; };
  var texto = (v('fBanda') || '').trim().toLowerCase();
  var iDe = v('fInscDe'), iAte = v('fInscAte');
  var sDe = v('fShowDe'), sAte = v('fShowAte');
  return dados.programacoes.filter(function(p){
    if (texto && (p.banda + ' ' + p.instagram).toLowerCase().indexOf(texto) < 0) return false;
    // A data da inscrição vem com hora junto; comparar só os 10 primeiros
    // caracteres deixa o dia escolhido contar inteiro, em vez de parar à meia-noite.
    var insc = (p.recebidoISO || '').slice(0, 10);
    if (iDe && (!insc || insc < iDe)) return false;
    if (iAte && (!insc || insc > iAte)) return false;
    if (sDe && p.dataShowISO < sDe) return false;
    if (sAte && p.dataShowISO > sAte) return false;
    return true;
  });
}

function limparUm(ids){
  ids.forEach(function(id){ document.getElementById(id).value = ''; });
  desenharProgramacoes();
}

function limparFiltros(){
  ['fBanda','fInscDe','fInscAte','fShowDe','fShowAte'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  desenharProgramacoes();
}

function desenharProgramacoes(){
  var alvo = document.getElementById('programacoes');
  if (!dados.programacoes.length){
    document.getElementById('contagem').textContent = '';
    alvo.innerHTML = '<div class="vazio">Nenhuma banda inscrita ainda.<br>Assim que alguém ' +
      'preencher o formulário, aparece aqui.</div>';
    return;
  }
  var lista = programacoesFiltradas();
  document.getElementById('contagem').textContent =
    lista.length === dados.programacoes.length
      ? lista.length + ' shows'
      : lista.length + ' de ' + dados.programacoes.length + ' shows';
  if (!lista.length){
    alvo.innerHTML = '<div class="vazio">Nenhum show com esse filtro.</div>';
    return;
  }
  alvo.innerHTML = lista.map(function(p){
    // A SEÇÃO DAS FOTOS.
    //
    // Cada foto tem UMA ação: baixar. Tinha quatro — original, editada, substituir e
    // desfazer —, e três delas existiam para alimentar o gerador de arte: substituir
    // mandava uma versão tratada à mão para a produção usar, e desfazer voltava
    // atrás. Sem gerador, não sobrou o que alimentar. O que este painel faz com uma
    // foto é entregá-la a quem vai fazer a arte.
    //
    // O selo do tratamento também saiu pelo mesmo motivo: "processada" e "resultado
    // duvidoso" eram o laudo do recorte automático, e laudo de um trabalho que não
    // acontece mais só confunde quem lê.
    var fotos = (p.fotos || []).length ?
      '<div class="secao"><div class="tituloSecao">Fotos enviadas' +
        '<span class="conta">' + p.fotos.length +
        (p.fotos.length === 1 ? ' foto' : ' fotos') + '</span></div>' +
      '<div class="fotos">' +
      p.fotos.map(function(f){
        // A imagem não vem de um endereço do Drive: aquele endereço só responde a
        // quem tem a sessão do Google, e o navegador não a manda para fora da
        // moldura isolada onde o painel roda — era o quadrado de imagem quebrada.
        // Quem busca é o próprio sistema. Ver painelPreviasDaProgramacao.
        return '<figure class="foto">' +
          '<img data-prev="' + p.id + '|' + f.indice + '|original" alt="' +
            esc(f.nome) + '">' +
          '<figcaption>' +
            '<span class="nome" title="' + esc(f.nome) + '">' + esc(f.nome) + '</span>' +
            '<button class="b mini" onclick="baixarFoto(this,' + aspas(p.id) + ',' +
              f.indice + ')">Baixar</button>' +
          '</figcaption></figure>';
      }).join('') + '</div></div>' : '';

    // O CARTÃO DE UMA INSCRIÇÃO.
    //
    // O sistema virou painel de coleta: a banda manda os dados e as fotos, e as
    // artes são feitas fora. Então saíram daqui a galeria das artes, o refazer, o
    // aprovar, o reprovar, o pausar, o recalcular horários, as legendas e o modo de
    // publicação — tudo isso falava de um trabalho que o sistema não faz mais.
    //
    // O que sobrou é o que um painel de coleta precisa ter: quem é a banda, o que
    // ela preencheu, as fotos que mandou, e como levar tudo isso embora.
    // A FICHA DA BANDA.
    //
    // Era uma tabela de rótulo à esquerda, valor no meio e um botão "copiar" à
    // direita, repetido nove vezes — nove botões cinzentos empilhados, com o mesmo
    // peso visual do dado que importa. Parecia a planilha, e era exatamente o que o
    // painel deveria poupar de olhar.
    //
    // Agora cada dado é um BLOCO, e o bloco inteiro é o botão de copiar. Some a
    // fileira de botões, o alvo do clique fica grande, e o valor pode ser escrito no
    // tamanho de leitura em vez de espremido entre um rótulo e um botão.
    //
    // Os blocos vêm agrupados por assunto, porque é assim que se procura: quando é o
    // show, como falar com a banda, o que ela cobra, e o que ela mandou. Numa fileira
    // única de nove, achar o telefone é varrer tudo.
    var grupos = gruposDaBanda(p);

    var ficha =
      '<div class="secao fichaBanda">' +
        '<div class="tituloSecao">Dados da banda' +
          '<button class="b mini" onclick="copiarFicha(this,' + aspas(p.id) + ')">' +
          'Copiar tudo</button></div>' +
        grupos.map(function(g){
          return '<div class="grupoDados">' +
            '<div class="rotuloGrupo">' + esc(g.titulo) + '</div>' +
            '<div class="blocos">' + g.itens.map(function(d){
              var corpo =
                '<span class="rot">' + esc(d.rotulo) + '</span>' +
                '<span class="val">' + esc(d.valor) + '</span>';
              // Bloco sem resposta não é botão: não há o que copiar, e um alvo de
              // clique que não faz nada é pior que um pedaço de texto parado.
              return d.copiavel
                ? '<button class="dado" title="clique para copiar" ' +
                  'onclick="copiarCampo(this,' + aspas(p.id) + ',' + aspas(d.rotulo) +
                  ')">' + corpo + '<span class="pista">copiar</span></button>'
                : '<div class="dado' + (d.vazio ? ' semValor' : '') + '">' + corpo + '</div>';
            }).join('') + '</div></div>';
        }).join('') +
      '</div>';

    var acoesFinais = [];
    if ((p.fotos || []).length){
      acoesFinais.push('<button class="b forte" onclick="baixarFotosTodas(this,' +
        aspas(p.id) + ')">Baixar todas as fotos</button>');
    }
    if (p.pastaUrl){
      acoesFinais.push('<a class="b" href="' + esc(p.pastaUrl) + '" target="_blank">' +
        'Abrir a pasta no Drive</a>');
    }
    acoesFinais.push('<button class="b" onclick="mudarShow(this,' + aspas(p.id) +
      ')">Corrigir data ou hora</button>');

    var perigo = ['CANCELADA'].indexOf(p.situacao) < 0
      ? '<div class="acoes perigo"><button class="b risco" onclick="acao(this,' +
        aspas('cancelar') + ',' + aspas(p.id) + ')">Cancelar esta inscrição</button></div>'
      : '';

    return '<div class="cartao">' +
      '<div class="linha">' +
        '<div class="quem">' +
          '<div class="banda">' + esc(p.banda) + '</div>' +
          '<div class="meta">' + esc(p.dataShow) + ' · ' +
            esc((p.diaSemana || '').toLowerCase()) + ' · ' + esc(p.horaShow) + '</div>' +
        '</div>' +
        (p.situacao === 'CANCELADA'
          ? '<span class="etq e-CANCELADA">cancelada</span>'
          : '<span class="etq e-inscrita">inscrita em ' + esc(p.recebidoEm || '') + '</span>') +
      '</div>' +

      ficha + fotos +

      '<div class="acoesCartao">' +
        '<div class="acoes principal">' + acoesFinais.join('') + '</div>' +
        perigo +
      '</div>' +
      '</div>';
  }).join('');

  // As miniaturas vêm depois da tela, para a lista não esperar pelas imagens.
  carregarPrevias();
}

// Tudo que a banda preencheu, na ordem em que se precisa olhar.
//
// Dado que ela não preencheu aparece assim mesmo, dizendo que está vazio: um campo
// que some da ficha é indistinguível de um campo que ninguém pensou em mostrar, e
// "sem couvert" é informação — quer dizer entrada franca.
//
// `vazio` marca os que não têm resposta, para a tela os mostrar apagados em vez de
// com o mesmo peso de um dado de verdade. `copiavel` é falso neles: não há o que
// copiar, e um botão que copia nada é um botão que mente.
function dadosDaBanda(p){
  var fotos = (p.fotos || []).length;
  var colab = (p.colabs && p.colabs.length) ? p.colabs[0] : '';
  return [
    { rotulo: 'Banda', valor: p.banda || '—', copiavel: !!p.banda, vazio: !p.banda },
    { rotulo: 'Data do show',
      valor: (p.dataShow || '—') + (p.diaSemana ? ' · ' + p.diaSemana.toLowerCase() : ''),
      copiavel: !!p.dataShow, vazio: !p.dataShow },
    { rotulo: 'Hora do show', valor: p.horaShow || '—',
      copiavel: !!p.horaShow, vazio: !p.horaShow },
    { rotulo: 'Telefone', valor: p.telefone || 'não informado',
      copiavel: !!p.telefone, vazio: !p.telefone },
    { rotulo: 'Instagram', valor: p.instagram || 'não informado',
      copiavel: !!p.instagram, vazio: !p.instagram },
    { rotulo: 'Couvert', valor: p.couvert ? 'R$ ' + p.couvert : 'sem couvert (entrada franca)',
      copiavel: !!p.couvert, vazio: !p.couvert },
    { rotulo: 'Coautor no post', valor: colab || 'não pediu colaboração',
      copiavel: !!colab, vazio: !colab },
    { rotulo: 'Fotos', valor: fotos + (fotos === 1 ? ' foto' : ' fotos') +
        (p.juntar ? ' · de integrantes separados' : '') +
        (p.temLogo ? ' · com logo' : ' · sem logo'),
      copiavel: false, vazio: !fotos },
    { rotulo: 'Inscrita em', valor: p.recebidoEm || '—', copiavel: false,
      vazio: !p.recebidoEm }
  ];
}

// Os dados agrupados por assunto, que é como se procura por eles: quando é o show,
// como falar com a banda, o que ela cobra, e o que ela mandou.
function gruposDaBanda(p){
  var todos = dadosDaBanda(p);
  var por = {};
  todos.forEach(function(d){ por[d.rotulo] = d; });
  var pegar = function(nomes){
    return nomes.map(function(n){ return por[n]; }).filter(Boolean);
  };
  return [
    { titulo: 'O show',   itens: pegar(['Data do show', 'Hora do show']) },
    { titulo: 'Contato',  itens: pegar(['Banda', 'Telefone', 'Instagram']) },
    { titulo: 'Entrada',  itens: pegar(['Couvert', 'Coautor no post']) },
    { titulo: 'Recebido', itens: pegar(['Fotos', 'Inscrita em']) }
  ].filter(function(g){ return g.itens.length; });
}

// O texto da ficha inteira, pronto para colar numa conversa.
function fichaEmTexto(p){
  return dadosDaBanda(p)
    .map(function(d){ return d.rotulo + ': ' + d.valor; })
    .join(String.fromCharCode(10));
}

function copiarFicha(botao, id){
  var p = acharPrograma(id);
  if (p) copiar(botao, fichaEmTexto(p));
}

// Copiar um campo só, pelo rótulo. O valor não viaja dentro do atributo do botão
// de propósito: telefone e @ com aspas ou acento já quebraram HTML montado assim,
// e aqui o botão carrega só o rótulo, que é texto que nós mesmos escrevemos.
function copiarCampo(bloco, id, rotulo){
  var p = acharPrograma(id);
  if (!p) return;
  var campo = dadosDaBanda(p).filter(function(d){ return d.rotulo === rotulo; })[0];
  if (!campo) return;

  // O bloco inteiro é o botão, então o aviso de "copiado" acontece NELE: trocar o
  // texto como se faz num botão comum apagaria o dado que a pessoa veio ver.
  copiarTexto(campo.valor, function(deu){
    if (!deu){
      recado('Não consegui copiar sozinho. Selecione o texto e copie à mão.', 7000);
      return;
    }
    var pista = bloco.querySelector('.pista');
    var antes = pista ? pista.textContent : '';
    bloco.classList.add('copiado');
    if (pista) pista.textContent = 'copiado';
    setTimeout(function(){
      bloco.classList.remove('copiado');
      if (pista) pista.textContent = antes;
    }, 1400);
  });
}

// Copiar de dentro do painel.
//
// O caminho moderno (navigator.clipboard) é bloqueado em parte dos navegadores
// quando a página roda dentro de uma moldura isolada, que é o caso aqui. Então
// quando ele falha o jeito antigo assume: um campo escondido, selecionado e
// copiado. Feio, e é o que funciona em todo lugar.
/**
 * Põe um texto na área de transferência, e diz se deu.
 *
 * Dois caminhos, e o segundo não é luxo: o caminho moderno é bloqueado em parte dos
 * navegadores quando a página roda dentro de uma moldura isolada, que é exatamente
 * o caso do painel. Quando ele falha, o jeito antigo assume — um campo escondido,
 * selecionado e copiado. Feio, e é o que funciona em todo lugar.
 */
function copiarTexto(texto, aoTerminar){
  var pelaMaoVelha = function(){
    var campo = document.createElement('textarea');
    campo.value = texto;
    campo.setAttribute('readonly', '');
    campo.style.position = 'fixed';
    campo.style.opacity = '0';
    document.body.appendChild(campo);
    campo.select();
    var deu = false;
    try { deu = document.execCommand('copy'); } catch (e) { deu = false; }
    campo.remove();
    aoTerminar(deu);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(function(){ aoTerminar(true); }, pelaMaoVelha);
  } else {
    pelaMaoVelha();
  }
}

/** Copiar a partir de um botão comum, que vira "copiado" por um instante. */
function copiar(botao, texto){
  copiarTexto(texto, function(deu){
    if (!deu){
      recado('Não consegui copiar sozinho. Selecione o texto e copie à mão.', 7000);
      return;
    }
    var antes = botao.textContent;
    botao.textContent = 'copiado';
    botao.disabled = true;
    setTimeout(function(){ botao.textContent = antes; botao.disabled = false; }, 1400);
  });
}

// O Apps Script devolve arquivo em base64 — não dá para apontar um link direto
// para ele. Aqui ele vira um arquivo de verdade dentro do navegador e o download
// começa sozinho, sem passar por servidor nenhum.
function baixarBase64(arquivo){
  var cru = atob(arquivo.conteudo);
  var bytes = new Uint8Array(cru.length);
  for (var i = 0; i < cru.length; i++) bytes[i] = cru.charCodeAt(i);
  var url = URL.createObjectURL(new Blob([bytes], {type: arquivo.tipo}));
  var a = document.createElement('a');
  a.href = url; a.download = arquivo.nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
}


/**
 * As ações simples do cartão, todas por aqui.
 *
 * Todas recebem o botão que foi clicado: é ele que fica desligado enquanto a
 * operação corre, para o mesmo pedido não sair duas vezes. Antes nenhuma recebia, e
 * o botão continuava clicável durante a espera.
 *
 * As que não dão para desfazer pedem confirmação dizendo o que vai acontecer — e
 * não só "tem certeza?", que não informa nada.
 */
function acao(botao, fn, id){
  if (fn === 'reprovar'){
    var m = prompt('O que está errado nas artes? Fica registrado, e ajuda a lembrar ' +
                   'depois por que esta banda foi reprovada.');
    if (m === null) return;
    return chamar('painelReprovar', [id, m], null, 'aprovar|' + id, botao);
  }
  if (fn === 'cancelar'){
    var p = acharPrograma(id);
    var nome = p ? p.banda : 'esta banda';
    if (!confirm('Cancelar o show de ' + nome + '?\n\n' +
                 'As publicações que ainda não saíram são tiradas da fila. As que já ' +
                 'foram publicadas continuam no Instagram — isso não as remove.')) return;
    return chamar('painelCancelar', [id], null, 'cancelar|' + id, botao);
  }
  chamar(fn, [id], null, fn + '|' + id, botao);
}

function trocarModo(seletor, id){
  seletor.disabled = true;
  chamar('painelDefinirModo', [id, seletor.value], null, 'modo|' + id);
}

// ------------------------------------------------- fotos enviadas pela banda

// As miniaturas, buscadas depois que a tela já apareceu.
//
// UMA viagem por banda, e as bandas todas ao mesmo tempo. A primeira versão disto
// buscava uma foto por vez, por educação com o servidor, e foi erro meu: cada ida e
// volta ao Apps Script custa de 2 a 3 segundos, então quatro fotos de uma banda
// davam mais de dez segundos de quadrado cinza na tela. Agora o tempo total é o de
// UMA ida e volta, não o de quatro vezes o número de bandas.
//
// O que já veio fica guardado enquanto o painel está aberto. Isso importa mais do
// que parece: a lista inteira é redesenhada depois de cada ação — aprovar, trocar
// foto, filtrar — e sem a lembrança as fotos recomeçariam do cinza toda vez.
var previasGuardadas = {};

function carregarPrevias(){
  var pendentes = Array.prototype.slice.call(
    document.querySelectorAll('img[data-prev]:not([data-feito])'));
  if (!pendentes.length) return;

  var porBanda = {};
  pendentes.forEach(function(img){
    img.setAttribute('data-feito', '1');
    var partes = img.getAttribute('data-prev').split('|');
    var id = partes[0], indice = Number(partes[1]);
    var lembrado = previasGuardadas[id + '|' + indice];
    if (lembrado !== undefined){
      if (lembrado) img.src = lembrado;
      else img.replaceWith(semPrevia('não consegui montar a prévia'));
      return;
    }
    (porBanda[id] = porBanda[id] || []).push({ img: img, indice: indice });
  });

  Object.keys(porBanda).forEach(function(id){
    var alvos = porBanda[id];
    google.script.run
      .withSuccessHandler(function(lista){
        var porIndice = {};
        (lista || []).forEach(function(p){ porIndice[p.indice] = p; });
        alvos.forEach(function(a){
          var p = porIndice[a.indice];
          var dados = p ? p.dados : '';
          previasGuardadas[id + '|' + a.indice] = dados || '';
          if (dados) a.img.src = dados;
          else a.img.replaceWith(semPrevia((p && p.erro) || 'prévia não veio'));
        });
      })
      .withFailureHandler(function(e){
        alvos.forEach(function(a){
          a.img.replaceWith(semPrevia(e && e.message ? e.message : 'erro ao buscar'));
        });
      })
      .painelPreviasDaProgramacao(CHAVE, id);
  });
}

// Depois de trocar ou desfazer uma foto, o que estava guardado daquela banda não
// vale mais: a imagem mudou. Sem isto o painel mostraria a foto antiga com ar de
// atual, que é o pior tipo de erro — parece ter funcionado.
function esquecerPrevias(id){
  Object.keys(previasGuardadas).forEach(function(k){
    if (k.indexOf(id + '|') === 0) delete previasGuardadas[k];
  });
}

// No lugar da imagem que não veio, um aviso em texto — e não o quadrado de imagem
// quebrada, que não diz nada a quem olha.
function semPrevia(motivo){
  var d = document.createElement('div');
  d.className = 'semPrevia';
  d.textContent = motivo;
  return d;
}

function baixarFoto(botao, id, indice){
  // Sempre a foto que a BANDA mandou. Havia a escolha entre original e editada
  // porque o sistema guardava uma versão tratada à mão para o gerador usar; sem
  // gerador, o que este painel entrega é o que foi recebido.
  if (botao){ botao.disabled = true; botao.textContent = 'baixando…'; }
  var soltar = function(){
    if (botao){ botao.disabled = false; botao.textContent = 'Baixar'; }
  };
  recado('Buscando a foto…', 20000);
  google.script.run
    .withSuccessHandler(function(a){ soltar(); baixarBase64(a); recado('Baixada: ' + a.nome, 5000); })
    .withFailureHandler(function(e){ soltar(); recado('Não consegui: ' + e.message, 9000); })
    .painelBaixarFoto(CHAVE, id, indice, 'original');
}

function baixarFotosTodas(botao, id){
  if (botao){ botao.disabled = true; botao.textContent = 'juntando…'; }
  var soltar = function(){
    if (botao){ botao.disabled = false; botao.textContent = 'Baixar todas as fotos'; }
  };
  recado('Juntando as fotos…', 25000);
  google.script.run
    .withSuccessHandler(function(z){
      soltar();
      baixarBase64(z);
      recado(z.quantas + ' arquivo(s) baixado(s).', 6000);
    })
    .withFailureHandler(function(e){ soltar(); recado('Não consegui: ' + e.message, 9000); })
    .painelBaixarFotosTodas(CHAVE, id);
}

function desenharAgenda(){
  // Era o calendário das publicações do Instagram. Sem publicação, aquela lista
  // ficaria vazia para sempre. Virou a agenda dos SHOWS: quem toca, quando, e
  // quando se inscreveu — que é o que um painel de coleta precisa mostrar.
  var alvo = document.getElementById('calendario');
  var lista = ((dados && dados.programacoes) || []).filter(function(p){
    return p.situacao !== 'CANCELADA';
  }).slice().sort(function(a, b){
    return String(a.dataShowISO) < String(b.dataShowISO) ? -1 : 1;
  });

  if (!lista.length){
    alvo.innerHTML = '<div class="vazio">Nenhum show inscrito ainda.</div>';
    return;
  }

  var hoje = new Date().toISOString().slice(0, 10);
  alvo.innerHTML = '<div class="cartao"><table><thead><tr>' +
    '<th>Data do show</th><th>Dia</th><th>Hora</th><th>Banda</th>' +
    '<th>Inscrita em</th></tr></thead><tbody>' +
    lista.map(function(p){
      var passou = String(p.dataShowISO) < hoje;
      return '<tr' + (passou ? ' class="passou"' : '') + '>' +
        '<td>' + esc(p.dataShow) + '</td>' +
        '<td>' + esc((p.diaSemana || '').toLowerCase()) + '</td>' +
        '<td>' + esc(p.horaShow) + '</td>' +
        '<td>' + esc(p.banda) + '</td>' +
        '<td class="meta">' + esc(p.recebidoEm || '—') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}
