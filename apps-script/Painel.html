<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{--preto:#0a0a0a;--vermelho:#d6121c;--cinza:#1b1b1b;--borda:#2e2e2e;--texto:#f2f2f2;--fraco:#9a9a9a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--preto);color:var(--texto);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px;padding-bottom:60px}
  h1{font-size:20px;letter-spacing:1px}
  h1 span{color:var(--vermelho)}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
  .aviso{background:#3a2a00;border:1px solid #7a5c00;color:#ffd96b;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  nav button{background:var(--cinza);color:var(--fraco);border:1px solid var(--borda);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:14px}
  nav button.on{background:var(--vermelho);color:#fff;border-color:var(--vermelho)}
  .cartao{background:var(--cinza);border:1px solid var(--borda);border-radius:10px;padding:14px;margin-bottom:12px}
  .linha{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .banda{font-size:17px;font-weight:700}
  .meta{color:var(--fraco);font-size:13px}
  .etq{display:inline-block;font-size:11px;letter-spacing:.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--borda);background:#000}
  .e-AGUARDANDO_APROVACAO{background:#4a3a00;color:#ffd96b;border-color:#7a5c00}
  .e-AGENDADA,.e-PUBLICADO,.e-APROVADA{background:#0d3a1a;color:#6ee89a;border-color:#1a6b33}
  .e-ERRO_ARTES,.e-FALHA,.e-REPROVADA{background:#430f12;color:#ff8d95;border-color:#7a1a20}
  .e-CANCELADA,.e-CANCELADO,.e-PAUSADA,.e-PAUSADO{background:#2a2a2a;color:#bbb}
  .e-AGUARDANDO_ARTES,.e-GERANDO_ARTES,.e-AGENDADO{background:#0f2a43;color:#8fc6ff;border-color:#1b4e7a}
  .artes{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
  .artes figure{flex:0 0 auto;width:104px}
  .artes img{width:104px;border-radius:6px;border:1px solid var(--borda);display:block;background:#000}
  .artes figcaption{font-size:11px;color:var(--fraco);text-align:center;margin-top:4px}
  .acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  /* Cada filtro é uma caixa fechada, com o nome em cima e o seu próprio botão de
     limpar: assim nenhum parece continuação do outro, e dá para usar um sozinho. */
  .filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
  .grupoFiltro{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    border:1px solid var(--borda);border-radius:9px;padding:8px 10px}
  .rotuloFiltro{display:block;width:100%;color:var(--fraco);font-size:11px;
    text-transform:uppercase;letter-spacing:.6px}
  .ate{color:var(--fraco);font-size:12px}
  button.b.mini{padding:4px 9px;line-height:1}
  /* As fotos que a banda enviou. Ficam acima das artes de propósito: quando uma
     arte sai ruim, é aqui que se descobre qual foto consertar. */
  .fotos{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .foto{width:150px;border:1px solid var(--borda);border-radius:9px;overflow:hidden;
    background:#000;display:flex;flex-direction:column}
  .foto img{width:100%;height:116px;object-fit:cover;display:block;background:#111}
  .foto .corpo{padding:7px 8px;display:flex;flex-direction:column;gap:5px}
  .foto .nome{font-size:11px;color:var(--fraco);word-break:break-all}
  .foto .estado{font-size:10px;letter-spacing:.5px;text-transform:uppercase;
    border-radius:4px;padding:2px 6px;align-self:flex-start}
  .fotos img{background:#161616}
  .semPrevia{display:flex;align-items:center;justify-content:center;text-align:center;
    padding:10px;font-size:11px;color:var(--fraco);background:#161616;min-height:120px}
  .e-ok{background:#0e2a16;color:#7ee29a;border:1px solid #1d5c33}
  .e-erro{background:#2e0d10;color:#ff9aa2;border:1px solid #7a2129}
  .e-duvidoso{background:#3a2a00;color:#ffd96b;border:1px solid #7a5c00}
  .e-editada{background:#102236;color:#8fc4ff;border:1px solid #28527f}
  .e-sem_informacao{background:#1a1a1a;color:var(--fraco);border:1px solid var(--borda)}
  .foto .motivo{font-size:11px;color:#cfcfcf;line-height:1.35}
  .foto .acoesFoto{display:flex;flex-wrap:wrap;gap:4px}
  .foto .acoesFoto button{font-size:10px;padding:3px 7px}
  .usando{font-size:10px;color:var(--fraco)}
  .artes .refaz{display:block;width:100%;margin-top:4px;font-size:11px;padding:3px 0}
  .filtros input[type=search]{width:230px;background:#000;color:var(--texto);
    border:1px solid var(--borda);border-radius:7px;padding:8px 12px;font-size:13px}
  .filtros input[type=date]{background:#000;color:var(--texto);border:1px solid var(--borda);
    border-radius:7px;padding:7px 9px;font-size:13px;margin-left:5px}
  .filtros .fdata{color:var(--fraco);font-size:13px}
  .filtros .sep{width:1px;height:22px;background:var(--borda);margin:0 4px}
  /* A marca de escolher a peça fica POR CIMA da arte, no canto: fora dela, numa
     lista separada, obrigaria a olhar a arte e procurar a linha dela embaixo. */
  figure{position:relative}
  .escolher{position:absolute;top:6px;left:6px;z-index:2;display:flex;align-items:center;
    gap:5px;background:rgba(0,0,0,.72);border:1px solid var(--borda);border-radius:6px;
    padding:3px 7px;font-size:11px;color:var(--texto);cursor:pointer}
  .escolher input{margin:0;cursor:pointer}
  button.b{border:1px solid var(--borda);background:#000;color:var(--texto);padding:8px 12px;border-radius:7px;cursor:pointer;font-size:13px}
  button.b:hover{border-color:var(--vermelho)}
  button.b.forte{background:var(--vermelho);border-color:var(--vermelho);color:#fff;font-weight:600}
  button.b:disabled{opacity:.4;cursor:not-allowed}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--borda);vertical-align:top}
  th{color:var(--fraco);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  input,select,textarea{background:#000;color:var(--texto);border:1px solid var(--borda);border-radius:6px;padding:7px 9px;font:inherit;font-size:13px}
  textarea{width:100%;min-height:150px;font-family:ui-monospace,monospace;font-size:12px}
  .cfg{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--borda)}
  .cfg .ajuda{color:var(--fraco);font-size:12.5px;margin-top:3px}
  .cfg code{color:#8fc6ff;font-size:12px}
  .vazio{color:var(--fraco);padding:30px;text-align:center}
  #recado{position:fixed;left:16px;right:16px;bottom:16px;background:var(--vermelho);color:#fff;padding:12px 14px;border-radius:8px;display:none;z-index:9;font-size:14px}
  dialog{background:var(--cinza);color:var(--texto);border:1px solid var(--borda);border-radius:10px;max-width:640px;width:92%;padding:18px}
  dialog::backdrop{background:rgba(0,0,0,.7)}
  @media(max-width:520px){.cfg{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>WOOD<span>STOCK</span> · painel</h1>
  <div class="meta" id="estado">carregando…</div>
</header>

<div class="aviso" id="trava" style="display:none"></div>

<nav>
  <button class="on" data-aba="programacoes">Programações</button>
  <button data-aba="calendario">Calendário</button>
  <button data-aba="config">Configurações</button>
  <button data-aba="historico">Histórico</button>
</nav>

<div id="barraFiltro" class="filtros">
  <div class="grupoFiltro">
    <span class="rotuloFiltro">Banda ou artista</span>
    <input type="search" id="fBanda" placeholder="parte do nome ou do @" oninput="desenharProgramacoes()">
    <button class="b mini" onclick="limparUm(['fBanda'])" title="limpar este filtro">×</button>
  </div>
  <div class="grupoFiltro">
    <span class="rotuloFiltro">Data da inscrição</span>
    <input type="date" id="fInscDe" onchange="desenharProgramacoes()">
    <span class="ate">até</span>
    <input type="date" id="fInscAte" onchange="desenharProgramacoes()">
    <button class="b mini" onclick="limparUm(['fInscDe','fInscAte'])" title="limpar este filtro">×</button>
  </div>
  <div class="grupoFiltro">
    <span class="rotuloFiltro">Data do show</span>
    <input type="date" id="fShowDe" onchange="desenharProgramacoes()">
    <span class="ate">até</span>
    <input type="date" id="fShowAte" onchange="desenharProgramacoes()">
    <button class="b mini" onclick="limparUm(['fShowDe','fShowAte'])" title="limpar este filtro">×</button>
  </div>
  <div class="grupoFiltro">
    <span class="rotuloFiltro">Relatório em PDF</span>
    <button class="b" onclick="baixarRelatorio('SEMANAL')">Semanal</button>
    <button class="b" onclick="baixarRelatorio('MENSAL')">Mensal</button>
    <button class="b" onclick="baixarRelatorio('TRIMESTRAL')">Trimestral</button>
  </div>
  <div class="grupoFiltro">
    <button class="b" onclick="limparFiltros()">Limpar tudo</button>
    <span class="meta" id="contagem"></span>
  </div>
</div>
<div id="programacoes"></div>
<div id="calendario" hidden></div>
<div id="config" hidden></div>
<div id="historico" hidden></div>

<div id="recado"></div>

<dialog id="janela"><div id="janelaCorpo"></div>
  <div class="acoes"><button class="b" onclick="document.getElementById('janela').close()">Fechar</button></div>
</dialog>

<script>
// O valor entra aqui por substituição de texto, não pelo mecanismo de template:
// ele escapa o conteúdo e a chave chegaria deturpada.
var CHAVE = '__CHAVE__';
var dados = null;

function recado(texto, ms){
  var el = document.getElementById('recado');
  el.textContent = texto; el.style.display = 'block';
  clearTimeout(el._t); el._t = setTimeout(function(){ el.style.display='none'; }, ms || 4000);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function chamar(fn, args, aoTerminar){
  recado('Processando…', 60000);
  google.script.run
    .withSuccessHandler(function(r){ recado('Pronto.'); if(aoTerminar) aoTerminar(r); else carregar(); })
    .withFailureHandler(function(e){ recado('Não deu certo: ' + e.message, 9000); })
    [fn].apply(null, [CHAVE].concat(args || []));
}

function carregar(){
  google.script.run.withSuccessHandler(function(d){ dados = d; desenhar(); })
    .withFailureHandler(function(e){ recado('Erro ao carregar: ' + e.message, 9000); })
    .painelCarregar(CHAVE);
}

function desenhar(){
  var e = dados.estado;
  document.getElementById('estado').textContent =
    dados.programacoes.length + ' programações · ' +
    (e.postsPorSituacao.AGENDADO || 0) + ' na fila · ' +
    (e.postsPorSituacao.PUBLICADO || 0) + ' publicadas · modo ' + e.modo;

  var trava = document.getElementById('trava');
  if (!e.publicandoDeVerdade){
    trava.style.display = 'block';
    trava.innerHTML = '<b>Modo de teste ligado.</b> O sistema faz tudo — cria as artes, escreve as ' +
      'legendas e cumpre o calendário — mas <b>não envia nada para o Instagram</b>; as publicações ' +
      'ficam marcadas como SIMULADO. Para publicar de verdade, mude <code>PUBLICAR_DE_VERDADE</code> ' +
      'para SIM em Configurações.';
  } else if (!e.instagramConectado){
    trava.style.display = 'block';
    trava.innerHTML = '<b>Instagram não conectado.</b> As publicações vão falhar até as credenciais serem configuradas.';
  } else { trava.style.display = 'none'; }

  desenharProgramacoes(); desenharCalendario(); desenharConfig(); desenharHistorico();
}

// As programações chegam do servidor já em ordem de data, da mais recente para a
// mais antiga. A lista só é filtrada aqui — a ordem não é mexida.
// Dois recortes de data, que respondem perguntas diferentes e podem ser usados
// juntos: "o que entrou esta semana" (data da inscrição) e "quem toca em dezembro"
// (data do show). Um só não serve para as duas coisas.
function programacoesFiltradas(){
  var v = function(id){ return document.getElementById(id).value; };
  var texto = (v('fBanda') || '').trim().toLowerCase();
  var iDe = v('fInscDe'), iAte = v('fInscAte');
  var sDe = v('fShowDe'), sAte = v('fShowAte');
  return dados.programacoes.filter(function(p){
    if (texto && (p.banda + ' ' + p.instagram).toLowerCase().indexOf(texto) < 0) return false;
    // A data da inscrição vem com hora junto; comparar só os 10 primeiros
    // caracteres deixa o dia escolhido contar inteiro, em vez de parar à meia-noite.
    var insc = (p.recebidoISO || '').slice(0, 10);
    if (iDe && (!insc || insc < iDe)) return false;
    if (iAte && (!insc || insc > iAte)) return false;
    if (sDe && p.dataShowISO < sDe) return false;
    if (sAte && p.dataShowISO > sAte) return false;
    return true;
  });
}

function limparUm(ids){
  ids.forEach(function(id){ document.getElementById(id).value = ''; });
  desenharProgramacoes();
}

function limparFiltros(){
  ['fBanda','fInscDe','fInscAte','fShowDe','fShowAte'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  desenharProgramacoes();
}

function desenharProgramacoes(){
  var alvo = document.getElementById('programacoes');
  if (!dados.programacoes.length){
    document.getElementById('contagem').textContent = '';
    alvo.innerHTML = '<div class="vazio">Nenhuma banda inscrita ainda.<br>Assim que alguém ' +
      'preencher o formulário, aparece aqui.</div>';
    return;
  }
  var lista = programacoesFiltradas();
  document.getElementById('contagem').textContent =
    lista.length === dados.programacoes.length
      ? lista.length + ' shows'
      : lista.length + ' de ' + dados.programacoes.length + ' shows';
  if (!lista.length){
    alvo.innerHTML = '<div class="vazio">Nenhum show com esse filtro.</div>';
    return;
  }
  alvo.innerHTML = lista.map(function(p){
    var pecas = [];
    ['A','B','C'].forEach(function(o){
      if (p.feed[o]) pecas.push({u:p.feed[o], t:'publicação ' + o, k:'FEED:' + o});
      if (p.story[o]) pecas.push({u:p.story[o], t:'story ' + o, k:'STORY:' + o});
    });
    // Esperando aprovação, cada arte ganha sua própria marca: se uma saiu torta,
    // só ela fica de fora e as outras seguem. Fora da aprovação não há o que
    // marcar, e a galeria é só galeria.
    var escolher = p.situacao === 'AGUARDANDO_APROVACAO';
    var galeria = pecas.length ? '<div class="artes">' + pecas.map(function(x){
      return '<figure>' +
             (escolher ? '<label class="escolher"><input type="checkbox" checked ' +
                'data-prog="'+esc(p.id)+'" data-peca="'+esc(x.k)+'">publicar</label>' : '') +
             '<a href="'+esc(x.u)+'" target="_blank"><img src="'+esc(x.u)+'" loading="lazy" alt="'+esc(x.t)+'"></a>' +
             '<figcaption>'+esc(x.t)+'</figcaption>' +
             '<button class="b mini refaz" title="refazer tentando outro tratamento" ' +
               'onclick="refazerUma(\''+p.id+'\',\''+x.k+'\')">refazer</button>' +
             '</figure>'; }).join('') + '</div>' : '';

    // A galeria das FOTOS ENVIADAS, antes das artes. Cada uma com o que o
    // tratamento descobriu dela, e com o que dá para fazer: baixar a original,
    // mandar uma versão editada, ou desfazer a troca.
    var fotos = (p.fotos || []).length ? '<div class="meta" style="margin-top:14px">' +
      'Fotos enviadas pela banda</div><div class="fotos">' +
      p.fotos.map(function(f){
        var rotulo = {ok:'processada', erro:'precisa de conserto',
                      duvidoso:'resultado duvidoso', editada:'editada por você',
                      sem_informacao:'ainda não processada'}[f.estado] || f.estado;
        // A imagem NÃO vem num endereço do Drive: aquele endereço só responde a
        // quem tem a sessão do Google, e o navegador não a manda para fora da
        // moldura isolada onde o painel roda — o que deixava o quadrado de imagem
        // quebrada no lugar da foto. Quem busca é o próprio sistema, logo depois
        // desta tela aparecer. Ver painelPreviaFoto.
        var qual = f.editada ? 'editada' : 'original';
        return '<div class="foto">' +
          '<img data-prev="'+p.id+'|'+f.indice+'|'+qual+'" alt="'+esc(f.nome)+'">' +
          '<div class="corpo">' +
          '<span class="estado e-'+esc(f.estado)+'">'+esc(rotulo)+'</span>' +
          '<span class="nome">'+esc(f.nome)+'</span>' +
          (f.motivo ? '<span class="motivo">'+esc(f.motivo)+'</span>' : '') +
          (f.editada ? '<span class="usando">usando a editada de '+esc(f.editada.quando)+'</span>' : '') +
          '<div class="acoesFoto">' +
          '<button class="b mini" onclick="baixarFoto(\''+p.id+'\','+f.indice+',\'original\')">original</button>' +
          (f.editada ? '<button class="b mini" onclick="baixarFoto(\''+p.id+'\','+f.indice+',\'editada\')">editada</button>' : '') +
          '<button class="b mini" onclick="trocarFoto(\''+p.id+'\','+f.indice+')">substituir</button>' +
          (f.editada ? '<button class="b mini" onclick="desfazerFoto(\''+p.id+'\','+f.indice+')">desfazer</button>' : '') +
          '</div></div></div>';
      }).join('') + '</div>' : '';

    var acoes = [];
    if (p.situacao === 'AGUARDANDO_APROVACAO'){
      acoes.push('<button class="b forte" onclick="aprovarMarcadas(\''+p.id+'\')">Aprovar as marcadas</button>');
      acoes.push(bt('','Reprovar','reprovar',p.id));
    }
    if (['AGENDADA','APROVADA'].indexOf(p.situacao)>=0) acoes.push(bt('','Pausar','painelPausar',p.id));
    if (p.situacao === 'PAUSADA') acoes.push(bt('','Retomar','painelRetomar',p.id));
    if (pecas.length || ['ERRO_ARTES','REPROVADA'].indexOf(p.situacao)>=0) {
      acoes.push('<button class="b" onclick="refazerTodas(\''+p.id+'\')">Refazer todas</button>');
    }
    if (Object.keys(p.feed).length || Object.keys(p.story).length) {
      acoes.push(bt('','Recalcular horários','painelRecalcular',p.id));
      acoes.push('<button class="b" onclick="verLegendas(\''+p.id+'\')">Ver legendas</button>');
    }
    acoes.push('<button class="b" onclick="mudarShow(\''+p.id+'\')">Mudar data/hora</button>');
    acoes.push('<select onchange="chamar(\'painelDefinirModo\',[\''+p.id+'\',this.value])">' +
      opt('', '(modo global)', p.modo) + opt('AUTOMATICO','automático',p.modo) +
      opt('APROVACAO','com aprovação',p.modo) + '</select>');
    if (['CANCELADA','CONCLUIDA'].indexOf(p.situacao)<0) acoes.push(bt('','Cancelar tudo','cancelar',p.id));
    if (pecas.length) acoes.push('<button class="b" onclick="baixarTodas(\''+p.id+'\')">Baixar todas</button>');
    if (p.pastaUrl) acoes.push('<a class="b" style="text-decoration:none;display:inline-block" href="'+esc(p.pastaUrl)+'" target="_blank">Arquivos no Drive</a>');

    return '<div class="cartao">' +
      '<div class="linha"><div><div class="banda">'+esc(p.banda)+'</div>' +
      '<div class="meta">'+esc(p.dataShow)+' · '+esc(p.diaSemana)+' · '+esc(p.horaShow)+' · '+esc(p.instagram)+
      ' · '+p.recebidos+' arquivo(s) recebido(s)</div>' +
      (p.recebidoEm ? '<div class="meta">inscrita em '+esc(p.recebidoEm)+'</div>' : '') + '</div>' +
      '<span class="etq e-'+esc(p.situacao)+'">'+esc(p.situacao.replace(/_/g,' '))+'</span></div>' +
      (p.erro ? '<div class="meta" style="color:#ff8d95;margin-top:8px">'+esc(p.erro)+'</div>' : '') +
      (p.avisos ? '<div class="aviso" style="margin:10px 0 0"><b>Confira antes de aprovar:</b> '+esc(p.avisos)+'</div>' : '') +
      fotos + galeria + '<div class="acoes">'+acoes.join('')+'</div></div>';
  }).join('');

  // As miniaturas vêm depois da tela, para a lista não esperar pelas imagens.
  carregarPrevias();
}

// O Apps Script devolve arquivo em base64 — não dá para apontar um link direto
// para ele. Aqui ele vira um arquivo de verdade dentro do navegador e o download
// começa sozinho, sem passar por servidor nenhum.
function baixarBase64(arquivo){
  var cru = atob(arquivo.conteudo);
  var bytes = new Uint8Array(cru.length);
  for (var i = 0; i < cru.length; i++) bytes[i] = cru.charCodeAt(i);
  var url = URL.createObjectURL(new Blob([bytes], {type: arquivo.tipo}));
  var a = document.createElement('a');
  a.href = url; a.download = arquivo.nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
}

function aprovarMarcadas(id){
  var marcadas = [].slice.call(
    document.querySelectorAll('input[type=checkbox][data-prog="' + id + '"]'));
  var escolhidas = marcadas.filter(function(c){ return c.checked; })
                           .map(function(c){ return c.getAttribute('data-peca'); });
  if (!escolhidas.length){
    recado('Marque pelo menos uma peça para publicar, ou use Reprovar.', 6000);
    return;
  }
  var fora = marcadas.length - escolhidas.length;
  if (fora && !confirm(fora + ' peça(s) não vão ser publicadas. Continuar?')) return;
  chamar('painelAprovar', [id, escolhidas]);
}

function baixarTodas(id){
  recado('Juntando as artes…', 20000);
  google.script.run
    .withSuccessHandler(function(z){
      baixarBase64(z);
      recado(z.quantas + ' artes baixadas' +
        (z.falhas && z.falhas.length ? ' (' + z.falhas.length + ' falharam)' : '') + '.', 6000);
    })
    .withFailureHandler(function(e){ recado('Não consegui: ' + e.message, 9000); })
    .painelBaixarArtes(CHAVE, id);
}

function baixarRelatorio(periodo){

  google.script.run
    .withSuccessHandler(function(r){
      baixarBase64(r);
      recado('Relatório pronto: ' + r.shows + ' shows, ' + r.kb + ' KB.', 8000);
    })
    .withFailureHandler(function(e){ recado('Não consegui: ' + e.message, 9000); })
    .painelRelatorio(CHAVE, periodo);
}

// Refazer não repete: cada pedido tenta um tratamento diferente do anterior,
// porque o recorte é determinístico e repetir daria a mesma arte.
function refazerUma(id, peca){
  if (!confirm('Refazer as artes desta banda tentando outro tratamento? ' +
               'As seis peças saem do mesmo tratamento das fotos, então todas são ' +
               'refeitas — não dá para refazer uma sem refazer o tratamento.')) return;
  chamar('painelRefazer', [id, peca]);
}

function refazerTodas(id){
  if (!confirm('Refazer todas as artes desta banda, tentando outro tratamento?')) return;
  chamar('painelRefazer', [id, '']);
}

function bt(classe, rotulo, fn, id){
  return '<button class="b '+classe+'" onclick="acao(\''+fn+'\',\''+id+'\')">'+rotulo+'</button>';
}
function opt(v,r,atual){ return '<option value="'+v+'"'+(atual===v?' selected':'')+'>'+r+'</option>'; }

function acao(fn, id){
  if (fn === 'reprovar'){
    var m = prompt('O que está errado nas artes? (vai ficar registrado)');
    if (m === null) return;
    return chamar('painelReprovar', [id, m]);
  }
  if (fn === 'cancelar'){
    if (!confirm('Cancelar esta programação e tirar todas as publicações da fila?')) return;
    return chamar('painelCancelar', [id]);
  }
  chamar(fn, [id]);
}

function mudarShow(id){
  var p = dados.programacoes.filter(function(x){return x.id===id;})[0];
  var d = prompt('Nova data do show (AAAA-MM-DD). Deixe como está para não mudar:', p.dataShowISO);
  if (d === null) return;
  var h = prompt('Novo horário do show (HH:MM):', p.horaShow);
  if (h === null) return;
  chamar('painelAlterarShow', [id, d, h]);
}

function verLegendas(id){
  var p = dados.programacoes.filter(function(x){return x.id===id;})[0];
  var html = '<h3 style="margin-bottom:4px">Legendas — '+esc(p.banda)+'</h3>' +
    '<p class="meta" style="margin-bottom:10px">Cada legenda acompanha a publicação ' +
    'daquele layout. Story não leva legenda — o Instagram não aceita. Pode reescrever ' +
    'à vontade e salvar; se as publicações já estiverem na fila, o texto delas também ' +
    'é trocado.</p>';
  ['A','B','C'].forEach(function(o){
    if (!p.legendas[o]) return;
    html += '<p class="meta" style="margin-top:12px">Publicação ' + o + '</p>' +
            '<textarea id="leg'+o+'">'+esc(p.legendas[o])+'</textarea>';
  });
  html += '<div class="acoes" style="margin-top:12px">' +
    '<button class="b forte" onclick="salvarLegendas(\''+id+'\')">Salvar legendas</button>' +
    '<button class="b" onclick="fecharJanela()">Fechar</button>' +
    '</div>';
  document.getElementById('janelaCorpo').innerHTML = html;
  document.getElementById('janela').showModal();
}

// ------------------------------------------------- fotos enviadas pela banda

// As miniaturas, buscadas depois que a tela já apareceu.
//
// UMA viagem por banda, e as bandas todas ao mesmo tempo. A primeira versão disto
// buscava uma foto por vez, por educação com o servidor, e foi erro meu: cada ida e
// volta ao Apps Script custa de 2 a 3 segundos, então quatro fotos de uma banda
// davam mais de dez segundos de quadrado cinza na tela. Agora o tempo total é o de
// UMA ida e volta, não o de quatro vezes o número de bandas.
//
// O que já veio fica guardado enquanto o painel está aberto. Isso importa mais do
// que parece: a lista inteira é redesenhada depois de cada ação — aprovar, trocar
// foto, filtrar — e sem a lembrança as fotos recomeçariam do cinza toda vez.
var previasGuardadas = {};

function carregarPrevias(){
  var pendentes = Array.prototype.slice.call(
    document.querySelectorAll('img[data-prev]:not([data-feito])'));
  if (!pendentes.length) return;

  var porBanda = {};
  pendentes.forEach(function(img){
    img.setAttribute('data-feito', '1');
    var partes = img.getAttribute('data-prev').split('|');
    var id = partes[0], indice = Number(partes[1]);
    var lembrado = previasGuardadas[id + '|' + indice];
    if (lembrado !== undefined){
      if (lembrado) img.src = lembrado;
      else img.replaceWith(semPrevia('não consegui montar a prévia'));
      return;
    }
    (porBanda[id] = porBanda[id] || []).push({ img: img, indice: indice });
  });

  Object.keys(porBanda).forEach(function(id){
    var alvos = porBanda[id];
    google.script.run
      .withSuccessHandler(function(lista){
        var porIndice = {};
        (lista || []).forEach(function(p){ porIndice[p.indice] = p; });
        alvos.forEach(function(a){
          var p = porIndice[a.indice];
          var dados = p ? p.dados : '';
          previasGuardadas[id + '|' + a.indice] = dados || '';
          if (dados) a.img.src = dados;
          else a.img.replaceWith(semPrevia((p && p.erro) || 'prévia não veio'));
        });
      })
      .withFailureHandler(function(e){
        alvos.forEach(function(a){
          a.img.replaceWith(semPrevia(e && e.message ? e.message : 'erro ao buscar'));
        });
      })
      .painelPreviasDaProgramacao(CHAVE, id);
  });
}

// Depois de trocar ou desfazer uma foto, o que estava guardado daquela banda não
// vale mais: a imagem mudou. Sem isto o painel mostraria a foto antiga com ar de
// atual, que é o pior tipo de erro — parece ter funcionado.
function esquecerPrevias(id){
  Object.keys(previasGuardadas).forEach(function(k){
    if (k.indexOf(id + '|') === 0) delete previasGuardadas[k];
  });
}

// No lugar da imagem que não veio, um aviso em texto — e não o quadrado de imagem
// quebrada, que não diz nada a quem olha.
function semPrevia(motivo){
  var d = document.createElement('div');
  d.className = 'semPrevia';
  d.textContent = motivo;
  return d;
}

function baixarFoto(id, indice, qual){
  recado('Buscando a foto…', 20000);
  google.script.run
    .withSuccessHandler(function(a){ baixarBase64(a); recado('Baixada: ' + a.nome, 5000); })
    .withFailureHandler(function(e){ recado('Não consegui: ' + e.message, 9000); })
    .painelBaixarFoto(CHAVE, id, indice, qual);
}

function baixarFotosTodas(id){
  recado('Juntando as fotos…', 25000);
  google.script.run
    .withSuccessHandler(function(z){
      baixarBase64(z);
      recado(z.quantas + ' arquivo(s) baixado(s).', 6000);
    })

}

// O arquivo é lido no navegador e conferido ANTES de subir: tipo, tamanho e
// tamanho em pixels. Assim o erro aparece na hora, e não depois de uma espera.
var QUEBRA = String.fromCharCode(10);
var LADO_MINIMO = 600;
var MB_MAXIMO = 15;

function trocarFoto(id, indice){
  var campo = document.createElement('input');
  campo.type = 'file';
  campo.accept = 'image/png,image/jpeg';
  campo.onchange = function(){
    var arquivo = campo.files && campo.files[0];
    if (!arquivo) return;
    if (arquivo.size > MB_MAXIMO * 1048576){
      recado('A imagem tem ' + Math.round(arquivo.size / 1048576) +
             ' MB e o limite é ' + MB_MAXIMO + ' MB.', 9000);
      return;
    }
    var leitor = new FileReader();
    leitor.onload = function(){
      var img = new Image();
      img.onload = function(){
        if (Math.min(img.width, img.height) < LADO_MINIMO){
          recado('A imagem tem ' + img.width + '×' + img.height + ' pixels. ' +
                 'Abaixo de ' + LADO_MINIMO + ' ela sai borrada na arte.', 10000);
          return;
        }
        confirmarTroca(id, indice, arquivo, leitor.result, img.width, img.height);
      };
      img.onerror = function(){ recado('Não consegui abrir esse arquivo como imagem.', 9000); };
      img.src = leitor.result;
    };
    leitor.onerror = function(){ recado('Não consegui ler o arquivo.', 9000); };
    leitor.readAsDataURL(arquivo);
  };
  campo.click();
}

// Ver antes de confirmar: a troca muda o que vai para a arte, e vale conferir que
// é mesmo a imagem certa — sobretudo quando se editou várias.
function confirmarTroca(id, indice, arquivo, dados, largura, altura){
  document.getElementById('janelaCorpo').innerHTML =
    '<h3 style="margin-bottom:4px">Substituir a foto ' + (indice + 1) + '</h3>' +
    '<p class="meta" style="margin-bottom:10px">' + esc(arquivo.name) + ' · ' +
      largura + '×' + altura + ' · ' + Math.round(arquivo.size / 1024) + ' KB</p>' +
    '<img src="' + dados + '" style="max-width:100%;max-height:50vh;border:1px solid var(--borda);border-radius:8px">' +
    '<p class="meta" style="margin-top:10px">A foto que a banda enviou continua ' +
      'guardada e pode ser recuperada quando você quiser.</p>' +
    '<div class="acoes" style="margin-top:12px">' +
    '<button class="b forte" id="confirmaTroca">Usar esta imagem</button>' +
    '<button class="b" onclick="fecharJanela()">Cancelar</button></div>';
  document.getElementById('janela').showModal();

  document.getElementById('confirmaTroca').onclick = function(){
    this.disabled = true;
    this.textContent = 'Enviando…';
    google.script.run
      .withSuccessHandler(function(){
        fecharJanela();
        esquecerPrevias(id);   // a imagem mudou; a lembrança não vale mais
        carregar();
        // A arte NÃO é refeita sozinha, e a oferta vem aqui para a decisão ser
        // sua sem precisar procurar o botão. Dois motivos para não ser automático:
        // trocando três fotos, refazer a cada troca rodaria a produção três vezes,
        // e cada uma leva minutos; e refazer tira da fila as publicações já
        // agendadas, o que não pode acontecer em silêncio.
        if (confirm('Foto substituída.' + QUEBRA + QUEBRA +
            'Refazer as artes agora com ela?' + QUEBRA + QUEBRA +
            'Se for trocar mais fotos, troque todas primeiro e refaça uma vez só. ' +
            'Refazer tira da fila as publicações já agendadas desta banda.')) {
          chamar('painelRefazer', [id, '']);
        }
      })
      .withFailureHandler(function(e){
        fecharJanela();
        recado('Não consegui substituir: ' + e.message, 9000);
      })
      .painelSubstituirFoto(CHAVE, id, indice, {
        nome: arquivo.name, tipo: arquivo.type,
        conteudo: String(dados).split(',')[1]
      });
  };
}

function desfazerFoto(id, indice){
  if (!confirm('Voltar a usar a foto que a banda enviou nesta posição?')) return;
  esquecerPrevias(id);   // volta a valer a original; a lembrança da editada não serve
  chamar('painelRestaurarFoto', [id, indice]);
}

function verHistoricoFotos(id){
  google.script.run
    .withSuccessHandler(function(linhas){
      var html = '<h3 style="margin-bottom:10px">Histórico das fotos</h3>';
      html += linhas.length
        ? '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
          linhas.map(function(l){
            return '<tr><td style="padding:6px 8px;border-bottom:1px solid var(--borda)">' +
              esc(l.quando) + '</td><td style="padding:6px 8px;border-bottom:1px solid var(--borda)">foto ' +
              l.foto + '</td><td style="padding:6px 8px;border-bottom:1px solid var(--borda)">' +
              esc(l.acao) + '</td><td style="padding:6px 8px;border-bottom:1px solid var(--borda);color:var(--fraco)">' +
              esc(l.de) + ' → ' + esc(l.para) + '</td></tr>';
          }).join('') + '</table>'
        : '<p class="meta">Nenhuma foto foi trocada nesta programação.</p>';
      html += '<div class="acoes" style="margin-top:12px">' +
        '<button class="b" onclick="fecharJanela()">Fechar</button></div>';
      document.getElementById('janelaCorpo').innerHTML = html;
      document.getElementById('janela').showModal();
    })
    .withFailureHandler(function(e){ recado('Não consegui: ' + e.message, 9000); })
    .painelHistoricoDeFotos(CHAVE, id);
}

function fecharJanela(){ document.getElementById('janela').close(); }

function salvarLegendas(id){
  var textos = {};
  ['A','B','C'].forEach(function(o){
    var campo = document.getElementById('leg'+o);
    if (campo) textos[o] = campo.value;
  });
  google.script.run
    .withSuccessHandler(function(trocadas){
      document.getElementById('janela').close();
      recado('Legendas salvas' +
        (trocadas ? ' e ' + trocadas + ' publicação(ões) na fila atualizadas.' : '.'), 6000);
      carregar();
    })
    .withFailureHandler(function(e){ recado('Não consegui salvar: ' + e.message, 9000); })
    .painelSalvarLegendas(CHAVE, id, textos);
}

function desenharCalendario(){
  var alvo = document.getElementById('calendario');
  if (!dados.agendamentos.length){
    alvo.innerHTML = '<div class="vazio">Nada agendado ainda.</div>'; return;
  }
  alvo.innerHTML = '<div class="cartao"><table><thead><tr><th>Quando</th><th>Banda</th>' +
    '<th>Peça</th><th>Situação</th><th></th></tr></thead><tbody>' +
    dados.agendamentos.map(function(a){
      return '<tr><td>'+esc(a.quando)+'</td><td>'+esc(a.banda)+'</td>' +
        '<td>'+(a.canal==='FEED'?'feed':'story')+' '+esc(a.opcao)+
        (a.url?' · <a href="'+esc(a.url)+'" target="_blank" style="color:#8fc6ff">ver</a>':'')+'</td>' +
        '<td><span class="etq e-'+esc(a.situacao)+'">'+esc(a.situacao)+'</span>' +
        (a.erro?'<div class="meta" style="color:#ff8d95">'+esc(a.erro)+'</div>':'')+'</td>' +
        '<td>'+(a.situacao==='AGENDADO'?'<button class="b" onclick="chamar(\'painelCancelarPost\',[\''+esc(a.postId)+'\'])">Tirar da fila</button>':'')+'</td></tr>';
    }).join('') + '</tbody></table></div>';
}

function desenharConfig(){
  document.getElementById('config').innerHTML = '<div class="cartao">' +
    dados.config.map(function(c){
      var campo;
      if (['SIM','NAO'].indexOf(c.valor.toUpperCase())>=0){
        campo = '<select id="c_'+c.chave+'">'+opt('SIM','SIM',c.valor)+opt('NAO','NAO',c.valor)+'</select>';
      } else if (c.chave === 'MODO_OPERACAO'){
        campo = '<select id="c_'+c.chave+'">'+opt('AUTOMATICO','AUTOMATICO',c.valor)+opt('APROVACAO','APROVACAO',c.valor)+'</select>';
      } else {
        campo = '<input id="c_'+c.chave+'" value="'+esc(c.valor)+'" size="12">';
      }
      return '<div class="cfg"><div><code>'+esc(c.chave)+'</code>' +
        '<div class="ajuda">'+esc(c.ajuda)+'</div></div>' +
        '<div style="display:flex;gap:6px">'+campo+
        '<button class="b" onclick="salvarCfg(\''+c.chave+'\')">Salvar</button></div></div>';
    }).join('') + '</div>';
}

function salvarCfg(chave){
  chamar('painelDefinirConfig', [chave, document.getElementById('c_'+chave).value]);
}

function desenharHistorico(){
  document.getElementById('historico').innerHTML = '<div class="cartao"><table><thead><tr>' +
    '<th>Quando</th><th>Tipo</th><th>Programação</th><th>O que aconteceu</th></tr></thead><tbody>' +
    dados.logs.map(function(l){
      var cor = l.nivel==='ERRO' ? '#ff8d95' : (l.nivel==='AVISO' ? '#ffd96b' : 'inherit');
      return '<tr><td>'+esc(l.quando)+'</td><td style="color:'+cor+'">'+esc(l.nivel)+'</td>' +
        '<td>'+esc(l.prog)+'</td><td>'+esc(l.evento)+
        (l.detalhe?'<div class="meta">'+esc(l.detalhe)+'</div>':'')+'</td></tr>';
    }).join('') + '</tbody></table></div>';
}

document.querySelectorAll('nav button').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('nav button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    ['programacoes','calendario','config','historico'].forEach(function(id){
      document.getElementById(id).hidden = (id !== b.dataset.aba);
    });
  };
});

carregar();
setInterval(carregar, 120000);
</script>
